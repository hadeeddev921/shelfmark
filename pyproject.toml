[project]
name = "shelfmark"
description = "Integrated library system built on the Invenio framework."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "Hadeed", email = "hadeed.dev921@gmail.com" },
]
keywords = [
  "Invenio",
  "shelfmark",
  "ILS",
  "library",
]
classifiers = [
  "Development Status :: 4 - Beta",
]
dependencies = [
  "alembic>=1.16.4,<2.0.0",
  "click>=8.1.8,<9.0.0",
  "flask-debugtoolbar>=0.15.1,<1.0.0",
  "invenio-access>=5.0.0,<6.0.0",
  "invenio-accounts>=7.0.0,<8.0.0",
  "invenio-app>=3.0.0,<4.0.0",
  "invenio-assets>=4.2.0,<5.0.0",
  "invenio-banners>=6.0.0,<7.0.0",
  "invenio-base>=2.3.2,<3.0.0",
  "invenio-cache>=3.0.0,<4.0.0",
  "invenio-celery>=2.2.0,<3.0.0",
  "invenio-circulation>=4.0.0,<5.0.0",
  "invenio-config>=1.1.0,<2.0.0",
  "invenio-db[postgresql,mysql]>=2.0.0,<3.0.0",
  "invenio-files-rest>=4.0.0,<5.0.0",
  "invenio-formatter>=4.0.0,<5.0.0",
  "invenio-i18n>=3.3.0,<4.0.0",
  "invenio-indexer>=4.0.0,<5.0.0",
  "invenio-jsonschemas>=2.1.0,<3.0.0",
  "invenio-logging[sentry]>=4.1.0,<5.0.0",
  "invenio-mail>=2.3.0,<3.0.0",
  "invenio-oaiserver>=4.0.0,<5.0.0",
  "invenio-oauth2server>=4.0.0,<5.0.0",
  "invenio-oauthclient>=7.0.0,<8.0.0",
  "invenio-opendefinition>=2.0.0a2,<3.0.0",
  "invenio-pages>=8.0.0,<9.0.0",
  "invenio-pidrelations>=1.0.0,<2.0.0",
  "invenio-pidstore>=3.0.0,<4.0.0",
  "invenio-records>=4.0.0,<5.0.0",
  "invenio-records-rest>=4.0.0,<5.0.0",
  "invenio-rest>=3.0.0,<4.0.0",
  "invenio-stats>=6.0.0,<7.0.0",
  "invenio-theme>=4.3.0,<5.0.0",
  "invenio-userprofiles>=5.0.0,<6.0.0",
  "jsonschema>=4.24.0,<5.0.0",
  "pycountry>=22.3.5,<25.0.0",
  "simplejson>=3.20.1,<4.0.0",
  "sqlalchemy_utils>=0.41.2",
  "webargs>=6.0.0",
  "werkzeug>=3.1.3,<4.0.0",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/hadeeddev921/shelfmark"

[project.scripts]
ils = "invenio_app.cli:cli"

[project.entry-points."flask.commands"]
stats = "invenio_stats.cli:stats"
vocabulary = "shelfmark.vocabularies.cli:vocabulary"

[project.entry-points."invenio_access.actions"]
backoffice_access_action = "shelfmark.permissions:backoffice_access_action"
backoffice_readonly_access_action = "shelfmark.permissions:backoffice_readonly_access_action"

[project.entry-points."invenio_assets.webpack"]
shelfmark_theme = "shelfmark.webpack:theme"

[project.entry-points."invenio_base.blueprints"]
logged_out = "shelfmark.views:create_logged_out_blueprint"

[project.entry-points."invenio_config.module"]
zy_shelfmark = "shelfmark.config"

[project.entry-points."invenio_i18n.translations"]
messages = "shelfmark"

[project.entry-points."invenio_jsonschemas.schemas"]
internal_locations = "shelfmark.internal_locations.schemas"
locations = "shelfmark.locations.schemas"
vocabularies = "shelfmark.vocabularies.schemas"

[project.entry-points."invenio_pidstore.fetchers"]
ilocid = "shelfmark.internal_locations.api:internal_location_pid_fetcher"
locid = "shelfmark.locations.api:location_pid_fetcher"
patid = "shelfmark.patrons.api:patron_pid_fetcher"
vocid = "shelfmark.vocabularies.api:vocabulary_pid_fetcher"

[project.entry-points."invenio_pidstore.minters"]
ilocid = "shelfmark.internal_locations.api:internal_location_pid_minter"
locid = "shelfmark.locations.api:location_pid_minter"
patid = "shelfmark.patrons.api:patron_pid_minter"
vocid = "shelfmark.vocabularies.api:vocabulary_pid_minter"

[project.entry-points."invenio_records.jsonresolver"]
internal_location = "shelfmark.internal_locations.jsonresolvers.internal_location"
vocabularies_licenses = "shelfmark.vocabularies.jsonresolvers.licenses"

[project.entry-points."invenio_search.mappings"]
internal_locations = "shelfmark.internal_locations.mappings"
locations = "shelfmark.locations.mappings"
patrons = "shelfmark.patrons.mappings"
vocabularies = "shelfmark.vocabularies.mappings"

[project.optional-dependencies]
lorem = [
  "lorem>=0.1.1",
]
opensearch2 = [
  "invenio-search[opensearch2]>=3.1.0,<4.0.0",
]
tests = [
  "docker-services-cli>=0.6.0",
  "mock>=2.0.0",
  "pluggy>=1.6.0",
  "pydocstyle==6.1.1",
  "pytest-black>=0.3.0",
  "pytest-invenio>=3.4.2",
  "pytest-mock>=1.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# see https://babel.pocoo.org/en/latest/messages.html#toml-configuration-format
[tool.babel]
[tool.babel.compile_catalog]
directory = "shelfmark/translations/"
use_fuzzy = true

[tool.babel.extract_messages]
copyright_holder = "CERN"
msgid_bugs_address = "hadeed.dev921@gmail.com"
mapping_file = "pyproject.toml"
output_file = "shelfmark/translations/messages.pot"
add_comments = "NOTE"

[tool.babel.init_catalog]
input_file = "shelfmark/translations/messages.pot"
output_dir = "shelfmark/translations/"

[[tool.babel.mappings]]
method = "javascript"
pattern = "**.js"
encoding = "utf-8"
extract_messages = "$._, jQuery._"

[[tool.babel.mappings]]
method = "python"
pattern = "**.py"
encoding = "utf-8"

[[tool.babel.mappings]]
method = "jinja2"
pattern = "**/templates/**.html"
encoding = "utf-8"

[tool.hatch.version]
path = "shelfmark/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
  "/shelfmark",
]

[tool.isort]
profile = "black"

[tool.pydocstyle]
add_ignore = "D401"

[tool.pytest.ini_options]
addopts = "--cov=shelfmark --cov-report=term-missing"
testpaths = "tests shelfmark"
live_server_scope = "module"

# UV needs to be told explicitly which extras are conflicting:
# https://docs.astral.sh/uv/concepts/projects/config/#conflicting-dependencies
[tool.uv]
conflicts = [
  [
    { extra = "opensearch1" },
    { extra = "opensearch2" },
    { extra = "elasticsearch7" },
  ]
]

classifiers = [
  "Development Status :: 5 - Production",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.14",
]
